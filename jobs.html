<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Job Finder</title>
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;
    --accent:#1d4ed8;--accent-ink:#fff;--good:#067647;--mid:#b54708;--bad:#b42318;
    --chip:#eef2ff;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b0f17;--card:#141a24;--ink:#e6e9ef;--muted:#98a2b3;--line:#263041;
      --accent:#6b9bff;--accent-ink:#0b0f17;--good:#47cd89;--mid:#fdb022;--bad:#f97066;--chip:#1c2433}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:880px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
  textarea,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:200px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  .row{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .hint{color:var(--muted);font-size:13px}
  .err{color:var(--bad);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px}
  .job{display:grid;grid-template-columns:64px 1fr;gap:16px}
  .score{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:2px solid currentColor}
  .s-good{color:var(--good)}.s-mid{color:var(--mid)}.s-bad{color:var(--bad)}
  .job h3{margin:0;font-size:17px}
  .job h3 a{color:var(--ink)}
  .meta{color:var(--muted);font-size:13px;margin:2px 0 8px}
  .job ul{margin:6px 0 0 18px;padding:0}
  .flag{color:var(--bad)}
  h2{font-size:18px;margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>AI Job Finder</h1>
  <p class="sub">Paste your resume. AI builds your profile, pulls live listings from public job boards, and scores each one honestly — including what you're missing.</p>

  <form id="f" class="card">
    <label for="resume">Resume or experience summary</label>
    <textarea id="resume" required placeholder="Paste your resume text here…"></textarea>
    <div class="row"><input type="file" id="file" accept=".txt,.md"><span class="hint">or load a .txt / .md file</span></div>

    <div class="grid">
      <div><label for="desiredRole">Target role</label><input type="text" id="desiredRole" placeholder="e.g. Merchant services sales"></div>
      <div><label for="location">Location</label><input type="text" id="location" placeholder="e.g. Florida, USA"></div>
      <div><label for="minSalary">Minimum salary</label><input type="text" id="minSalary" placeholder="e.g. $70k"></div>
      <div><label for="mustHaves">Must-haves</label><input type="text" id="mustHaves" placeholder="e.g. base + commission"></div>
      <div><label for="dealBreakers">Deal-breakers</label><input type="text" id="dealBreakers" placeholder="e.g. 100% commission"></div>
      <div class="row" style="margin-top:26px"><input type="checkbox" id="remoteOnly"><label for="remoteOnly" style="margin:0">Remote only</label></div>
    </div>

    <div class="row">
      <button id="go" type="submit">Find matching jobs</button>
      <span id="status" class="hint" aria-live="polite"></span>
    </div>
  </form>

  <section id="out"></section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '#';

  $('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (f) $('resume').value = await f.text();
  });

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('go'), status = $('status'), out = $('out');
    btn.disabled = true; out.innerHTML = '';
    status.className = 'hint';
    status.textContent = 'Reading your resume, searching job boards, scoring matches… (up to ~30s)';
    try {
      const res = await fetch('/.netlify/functions/job-match', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          resume: $('resume').value,
          desiredRole: $('desiredRole').value,
          location: $('location').value,
          minSalary: $('minSalary').value,
          mustHaves: $('mustHaves').value,
          dealBreakers: $('dealBreakers').value,
          remoteOnly: $('remoteOnly').checked,
        }),
      });
      const data = await res.json().catch(() => ({ error: `Server returned HTTP ${res.status}` }));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      render(data);
      status.textContent = `Scanned ${data.scanned || 0} live listings.`;
    } catch (err) {
      status.className = 'err';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  function render(d) {
    const p = d.profile || {};
    let html = `<div class="card"><h2>Your profile</h2>
      <p><strong>${esc(p.headline)}</strong> · ${esc(p.seniority)}</p>
      <p>${esc(p.summary)}</p>
      <div class="hint">Searched for:</div>
      <div class="chips">${(d.queries || []).map((q) => `<span class="chip">${esc(q)}</span>`).join('')}</div>
      <div class="hint" style="margin-top:10px">Core skills:</div>
      <div class="chips">${(p.core_skills || []).map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>
    </div>`;

    if (!d.matches || !d.matches.length) {
      html += `<div class="card">No good matches in today's listings. Try a broader target role or turn off "Remote only".
        ${d.sourceErrors && d.sourceErrors.length ? `<p class="hint">Some job boards didn't respond: ${esc(d.sourceErrors.join('; '))}</p>` : ''}</div>`;
    }

    for (const m of d.matches || []) {
      const cls = m.score >= 80 ? 's-good' : m.score >= 50 ? 's-mid' : 's-bad';
      html += `<article class="card job">
        <div class="score ${cls}" title="Fit score">${esc(m.score)}</div>
        <div>
          <h3><a href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener noreferrer">${esc(m.title)}</a></h3>
          <div class="meta">${esc(m.company)} · ${esc(m.location)}${m.salary ? ' · ' + esc(m.salary) : ''} · via ${esc(m.source)}</div>
          <div>${esc(m.why)}</div>
          ${m.gaps && m.gaps.length ? `<div class="hint" style="margin-top:8px">Gaps to address:</div><ul>${m.gaps.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}
          ${m.red_flags && m.red_flags.length ? `<ul class="flag">${m.red_flags.map((g) => `<li>⚠ ${esc(g)}</li>`).join('')}</ul>` : ''}
        </div>
      </article>`;
    }
    $('out').innerHTML = html;
  }
})();
</script>
</body>
</html>
